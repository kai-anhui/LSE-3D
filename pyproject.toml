[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lse3d"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy>=1.24", "scipy>=1.10", "PyYAML>=6.0", "laspy>=2.5"]

[project.optional-dependencies]
test = ["pytest>=7"]
pretrained = ["transformers>=4.40"]

[tool.setuptools.packages.find]
include = ["data*", "models*", "utils*", "engine*", "tools*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
